<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Doable-Today</title>
    </head>

    <body>
        <header>
            <nav>
                <a href="week.html">Week</a>
                <a href="today.html">Today</a>
                <a href="groups.html">Groups</a>
                <a href="inbox.html">Inbox</a>
                <a href="index.html">Logout</a>
            </nav>
        </header>

        <main>
            <h1>Today</h1>
            <img src="today-image.png" alt="Illustration of a person climbing a ladder made of completed tasks while working on a laptop" width="400"/>
            <section>
                <h2>Your Calendar (Google Calendar API)</h2>
                <table>
                    <caption>Today's calendar events</caption>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Event</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>9:00 AM</td>
                            <td>Work meeting</td>
                        </tr>
                        <tr>
                            <td>2:00 PM</td>
                            <td>Class</td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <section>
                <h2>Today's Tasks</h2>
                <ul>
                    <li>
                        <input type="checkbox" id ="today-task-1" />
                        <label for="today-task-1">Finish essay draft</label>
                    </li>
                    <li>
                        <input type="checkbox" id="today-task-2"/>
                        <label for="today-task-2">Run 30 minutes</label>
                    </li>
                </ul>
                <p>Planned: 3 hours &mdash; Free time today: 5 hours. This fits</p>
            </section>
        </main>

        <footer>
            <p>Priya Merrill</p>
            <a href="https://github.com/PriyaMerrill/startup">GitHub Repository</a>
        </footer>
    </body>
</html>
