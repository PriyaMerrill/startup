<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!--title shows in the browser tab-->
        <title>Doable</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

        <link rel="stylesheet" href="styles.css" />


    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-md navbar-dark bg-dark">
                <div class="container">
                    <a class="navbar-brand fw-bold" href="index.html">Doable</a>

                    <button class="navbar-toggler" type ="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
                        aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navLinks">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="today.html">Today</a></li>
                            <li class="nav-item"><a class="nav-link" href="week.html">Week</a></li>
                            <li class="nav-item"><a class="nav-link" href="groups.html">Groups</a></li>
                            <li class="nav-item"><a class="nav-link" href="inbox.html">Inbox</a></li>
                            <li class="nav-item"><a class="nav-link" href="index.html">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-4">
            <h1 class="text-center mb-4">This Week</h1>
            <div class="text-center mb-4">
                <img class="img-fluid rounded shadow-sm" src="week-image.png" alt="Illustration of a person climbing a pencil next to a completed checklist" width="400" />
            </div>
            
            <div class="row g-4 mb-4">

                <section class="col-md-6">
                    <h2>Tasks</h2>
                    <ul class="list-group">
                        <li class="list-group-item">
                            <input class="form-check-input me-2" type="checkbox" id="task-1" />
                            <label class="form-check-label" for="task-1">Finish essay draft</label>
                        </li>
                        <li class="list-group-item">
                            <input class="form-check-input me-2" type="checkbox" id="task-2" />
                            <label class="form-check-label" for="task-2">Take marketing exam</label>
                        </li>
                    </ul>
                </section>

                <section class="col-md-6">
                    <h2>Weekly Goals</h2>
                    <ul class="list-group">
                        <li class="list-group-item">
                            <label class="form-label" for="goal-1">Run 3 times this week</label>
                            <progress class="goal-progress" id="goal-1" value="2" max="3"></progress>
                        </li>
                        <li class="list-group-item">
                            <label class="form-label" for="goal-2">Read twice this week</label>
                            <progress class="goal-progress" id="goal-2" value="1" max="2"></progress>
                        </li>
                    </ul>
                </section>
            </div>

            <form class="card p-4">
                <h2>Add to Week</h2>
                <label class="form-label" for="new-item">Item</label>
                <div class="input-group">
                    <input class="form-control" type="text" id="new-item" name="item" required />
                    <button class="btn btn-primary" type="submit">Add</button>
                </div>
            </form>
        </main>

        <footer class="bg-dark text-light text-center py-3 mt-auto">
            <p class="mb-1">Priya Merrill</p>
            <a class="link-light" href="https://github.com/PriyaMerrill/startup">GitHub Repository</a>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
