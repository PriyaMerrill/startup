<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Doable</title>
    </head>
    <body>
        <header>
            <nav>
                <a href="week.html">Week</a>
                <a href="today.html">Today</a>
                <a href="groups.html">Groups</a>
                <a href="inbox.html">Inbox</a>

            </nav>
        </header>

        <main>
            <h1>Inbox</h1>
            <img src="inbox-image.png" alt="Inbox Icon" width="400"/>
            
            <section>
                <h2>Unsorted Items</h2>
                <ul>
                    <li>
                        <span>Study for Marketing midterm</span>
                        <button type="button">Add to Week</button>
                        <button type="button">Add to Day</button>
                    </li>
                </ul>
            </section>
            <form>
                <h2>Add New Item</h2>
                <label for="new-inbox-item">Item</label>
                <input type="text" id="new-inbox-item" name="item" required />
                <button type="submit">Add</button>
            </form>
        </main>

        <footer>
            <p>Priya Merrill</p>
