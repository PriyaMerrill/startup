<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Doable-Inbox</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-md navbar-dark bg-dark">
                <div class="container">
                    <a class="navbar-brand fw-bold" href="index.html">Doable</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
                        aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navLinks">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="today.html">Today</a></li>
                            <li class="nav-item"><a class="nav-link" href="week.html">Week</a></li>
                            <li class="nav-item"><a class="nav-link" href="groups.html">Groups</a></li>
                            <li class="nav-item"><a class="nav-link active" href="inbox.html">Inbox</a></li>
                            <li class="nav-item"><a class="nav-link" href="index.html">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-4">
            <h1 class="text-center mb-4">Inbox</h1>
            <div class="text-center mb-4">
                <img class="img-fluid rounded shadow-sm" src="inbox-image.png" alt="Inbox icon showing an arrow pointing into a tray" width="400" />
            </div>

            <section class="mb-4">
                <h2>Unsorted Items</h2>
                <ul class="list-group">
                    <li class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <span>Study for Marketing midterm</span>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-primary btn-sm" type="button">Add to Week</button>
                            <button class="btn btn-outline-success btn-sm" type="button">Add to Day</button>
                        </div>
                    </li>
                </ul>
            </section>

            <form class="card p-4">
                <h2>Add New Item</h2>
                <label class="form-label" for="new-inbox-item">Item</label>
                <div class="input-group">
                    <input class="form-control" type="text" id="new-inbox-item" name="item" required />
                    <button class="btn btn-primary" type="submit">Add</button>
                </div>
            </form>
        </main>

        <footer class="bg-dark text-light text-center py-3 mt-auto">
            <p class="mb-1">Priya Merrill</p>
            <a class="link-light" href="https://github.com/PriyaMerrill/startup">GitHub Repository</a>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
