<!DOCTYPE html>

<html lang="en">
    <!--head is metadata about the page with no visible content-->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!--title shows in the browser tab-->
        <title>Doable</title>
    </head>

    <body>
        <header>
            <nav>
                <a href="week.html">Week</a>
                <a href="today.html">Today</a>
                <a href="groups.html">Groups</a>
                <a href="inbox.html">Inbox</a>
                <a href="index.html">Login</a>
            </nav>
        </header>

        <main>
            <h1>Doable</h1>
            <p>Turn everything you have going on into a realistic plan</p>
            <form>
                <h2>Login</h2>
                <label for="login-username">Username</label>
                <input type="text" id="login-username" name="username" required />

                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" required />

                <button type="submit">Sign In</button>
            </form>

            <form>
                <h2>Create Account</h2>
                <label for="create-username">Username</label>
                <input type="text" id="create-username" name="username" required />

                <label for="create-password">Password</label>
                <input type="password" id="create-password" name="password" required />

                <button type="submit">Sign Up</button>
            </form>

            <p>Welcome, <span id="username-display">[username]</span></p>
        </main>

        <footer>
            <p>Priya Merrill</p>
            <a href="https://github.com/PriyaMerrill/startup">GitHub Repository</a>
        </footer>

    </body>
</html>
