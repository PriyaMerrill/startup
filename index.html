<!DOCTYPE html>

<html lang="en">
    <!--head is metadata about the page with no visible content-->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!--title shows in the browser tab-->
        <title>Doable</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

        <link rel="stylesheet" href="styles.css" />


    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-md navbar-dark bg-dark">
                <div class="container">
                    <a class="navbar-brand fw-bold" href="index.html">Doable</a>

                    <button class="navbar-toggler" type ="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
                        aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navLinks">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="today.html">Today</a></li>
                            <li class="nav-item"><a class="nav-link" href="week.html">Week</a></li>
                            <li class="nav-item"><a class="nav-link" href="groups.html">Groups</a></li>
                            <li class="nav-item"><a class="nav-link" href="inbox.html">Inbox</a></li>
                            <li class="nav-item"><a class="nav-link" href="index.html">Login</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-4">
            <div class="text-center mb-4">
                <h1>Doable</h1>
                <p class="lead">Turn everything you have going on into a realistic plan</p>
                <img class="img-fluid rounded shadow-sm" src="login-image.png"
             alt="Illustration of a person balancing many tasks at once — checklist, calendar, and laptop — while riding a clock" width="400" />
            </div>
            <div class="row g-4">
                <div class="col-md-6">
                    <form class="card p-4 h-100">
                        <h2>Login</h2>
                        <label class="form-label" for="login-username">Username</label>
                        <input class="form-control mb-3" type="text" id="login-username" name="username" required />
                        <label class="form-label" for="login-password">Password</label>
                        <input class="form-control mb-3" type="password" id="login-password" name="password" required />
                        <button class="btn btn-primary" type="submit">Sign In</button>
                    </form>
                </div>
                <div class="col-md-6">
                    <form class="card p-4 h-100">
                        <h2>Create Account</h2>
                        <label class="form-label" for="create-username">Username</label>
                        <input class="form-control mb-3" type="text" id="create-username" name="username" required />
                        <label class="form-label" for="create-password">Password</label>
                        <input class="form-control mb-3" type="password" id="create-password" name="password" required />
                        <button class="btn btn-success" type="submit">Sign Up</button>
                    </form>
                </div>
            </div>
            <p class="mt-4 text-center">Welcome, <span id="username-display">[username]</span></p>
        </main>

        <footer class="bg-dark text-light text-center py-3 mt-auto">
            <p class="mb-1">Priya Merrill</p>
            <a class="link-light" href="https://github.com/PriyaMerrill/startup">GitHub Repository</a>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    </body>
</html>
